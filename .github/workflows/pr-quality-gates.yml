name: PR Quality Gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Verify required routes in build output
        run: node scripts/verify-routes.mjs

      # We run LHCI collection without built-in assertions so we can always
      # print exact per-route scores before failing the job.
      - name: Lighthouse CI (collect)
        run: npx -y @lhci/cli@0.14.0 collect --config=./lighthouserc.cjs

      - name: Lighthouse CI (assert from collected reports)
        run: node scripts/assert-lighthouse.mjs

      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-report
          path: .lighthouseci
          if-no-files-found: warn

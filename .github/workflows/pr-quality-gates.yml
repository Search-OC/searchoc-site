name: PR Quality Gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Verify required routes in build output
        run: node scripts/verify-routes.mjs

      - name: Lighthouse CI (collect)
        shell: bash
        run: |
          set -euo pipefail
          # Collect reports into .lighthouseci (default).
          # Capture output while preserving exit code.
          npx -y @lhci/cli@0.14.0 collect --config=./lighthouserc.cjs 2>&1 | tee lighthouse-output.txt

      - name: Lighthouse CI (assert thresholds from collected reports)
        shell: bash
        run: |
          set -euo pipefail
          # Append assert output to the same log; fail this step if thresholds are not met.
          node scripts/assert-lighthouse.mjs 2>&1 | tee -a lighthouse-output.txt

      - name: Upload Lighthouse artifacts (reports + console log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-report
          path: |
            .lighthouseci
            lighthouse-output.txt
          if-no-files-found: warn

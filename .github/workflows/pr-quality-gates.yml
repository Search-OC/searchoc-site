name: PR Quality Gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Verify required routes in build output
        run: node scripts/verify-routes.mjs

      - name: Lighthouse CI (collect + assert)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          # Capture full LHCI console output while preserving the failing exit code.
          npx -y @lhci/cli@0.14.0 autorun --config=./lighthouserc.cjs 2>&1 | tee lighthouse-output.txt

      - name: Upload Lighthouse artifacts (reports + console log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-report
          path: |
            lighthouse-reports
            lighthouse-output.txt
          if-no-files-found: warn

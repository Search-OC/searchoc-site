name: PR Quality Gates

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Verify required routes in build output
        run: node scripts/verify-routes.mjs

      - name: Start static server (dist)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory dist > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://localhost:8080/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          echo "--- server.log ---"
          cat server.log || true
          exit 1

      - name: Lighthouse CI (collect)
        shell: bash
        run: |
          set -euo pipefail
          npx -y @lhci/cli@0.14.0 collect --config=./lighthouserc.cjs 2>&1 | tee lighthouse-output.txt

      - name: Lighthouse CI (assert thresholds + write summary)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-lighthouse.mjs 2>&1 | tee -a lighthouse-output.txt

      - name: Comment Lighthouse summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- LIGHTHOUSE_SUMMARY -->';
            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, 'lighthouse-summary.md');
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'lighthouse-summary.md not found.';

            const body = `${marker}\n## [Lighthouse] CI Summary (PR Quality Gates)\n\n${summary}`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-report
          path: |
            .lighthouseci
            lighthouse-output.txt
            lighthouse-summary.md
            server.log
          if-no-files-found: warn

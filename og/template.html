<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; }
  .card {
    width: 1200px; height: 630px; padding: 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
    background: #FAF8F5; color: #1A1A1A;
  }
  .card.reversed { background: #3C8ECC; color: #FFFFFF; }
  .wordmark {
    font-family: Montserrat, sans-serif; font-weight: 700;
    font-size: 26px; letter-spacing: .18em; color: #3C8ECC;
  }
  .reversed .wordmark { color: #FFFFFF; }
  h1 {
    font-family: Montserrat, sans-serif; font-weight: 700;
    font-size: 76px; line-height: 1.06; letter-spacing: -.02em; max-width: 940px;
  }
  .subline {
    font-family: "Source Serif 4", Georgia, serif; font-weight: 400;
    font-size: 30px; line-height: 1.4; color: #797A78;
    max-width: 820px; margin-top: 24px;
  }
  .reversed .subline { color: #E4F0FA; }
  .foot {
    font-family: Montserrat, sans-serif; font-weight: 500;
    font-size: 22px; color: #797A78;
  }
  .reversed .foot { color: #E4F0FA; }
  .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 18px; background: #3C8ECC; }
  .reversed .bar { background: #2F5567; }
  .bar span { display: block; height: 100%; width: 22%; background: #ADCC37; }
</style>
</head>
<body>
  <div class="card __VARIANT__">
    <div class="wordmark">SEARCH OC</div>
    <div>
      <h1>__HEADLINE__</h1>
      <p class="subline">__SUBLINE__</p>
    </div>
    <div class="foot">searchoc.org</div>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
